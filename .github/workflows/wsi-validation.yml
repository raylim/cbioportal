name: WSI validation

# Cross-repository gate for the resource-data WSI stack: WSI slides are
# resource_data rows (WSI_SAMPLE/WSI_PATIENT, TYPE WHOLE_SLIDE_IMAGE) carrying
# a private wsi_serving object, imported from files generated by the Core
# converter. Every input is an immutable commit pin mirrored in
# wsi-validation-manifest.json. A TODO-successor placeholder (used while a
# frontend successor is being ported) fails the fixture-contract job and every
# frontend job, and so the acceptance gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_ENV: master
  BACKEND_REPOSITORY: raylim/cbioportal
  BACKEND_REF: 065b4df5a887b38c9da829d0bbce1ca9f8765499
  FRONTEND_REPOSITORY: raylim/cbioportal-frontend
  FRONTEND_PACKAGE_REF: f480cf210cb89f2eea8c7cb02c7ac902308f6ab1
  FRONTEND_STUDY_REF: 05430c2e7af13c7faec18e1fcfffb5120b2812fe
  FRONTEND_PATIENT_REF: c0651e31b505f88bcaba180d96a56c755f4d4435
  FRONTEND_MOLECULAR_REF: 210693aadbce274d55a1f7771ff533c4e3f820ab
  FRONTEND_ANNOTATIONS_REF: 1dafe191ad19f81e4a6b45c31e8367d1ee4b20e7
  FRONTEND_AGENT_REF: 685b16cc20e06f4dd8a6d218225c49af65152b69
  FRONTEND_STUDY_SLIDES_REF: 1cfc8ad844f9c2246153665b5b96b4887ef8a6fa
  FRONTEND_INTEGRATION_REF: d9376d2134938c12294f466073fa48c14b81951c
  # Keep every cross-repository input as a full immutable commit pin.
  CORE_REPOSITORY: raylim/cbioportal-core
  CORE_REF: 3e5bf6efa03a6f507f5fffd58480d277c05d785a
  TILE_REPOSITORY: cBioPortal/cbioportal-tile-server
  TILE_REF: 082c3f77ec7eb091bc4a17b96d89cf6d1618d73c
  TEST_STACK_REPOSITORY: cBioPortal/cbioportal-test
  TEST_STACK_REF: a450018f8fdadf5fe568d66d41154e9f25281dfb
  COMPOSE_REPOSITORY: cBioPortal/cbioportal-docker-compose
  COMPOSE_REF: 85099cb96ae0acd28f34af4f593709a7b892306f

jobs:
  fixture-contract:
    name: Verify WSI fixture and source pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: cbioportal-validation
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: cbioportal-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Core validator dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cbioportal-core/requirements.txt pyyaml
      - name: Validate manifest, workflow pins and fixture layout
        working-directory: cbioportal-validation
        # Fails on any TODO-successor placeholder: the gate must not pass on an
        # unresolved frontend tuple.
        run: python3 scripts/check_wsi_validation_pins.py
      - name: Regenerate the resource fixtures from the pinned Core and diff
        if: always()
        working-directory: cbioportal-validation
        run: >-
          python3 scripts/wsi_resource_fixtures.py
          --core-dir "$GITHUB_WORKSPACE/cbioportal-core"
          --check --validate

  core-import-validation:
    name: Core WSI conversion, validation and resource import tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: cbioportal-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: cbioportal-backend
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: cbioportal-validation
      - name: Run backend fresh/migrated resource_data schema parity check
        working-directory: cbioportal-validation/test
        env:
          WSI_SCHEMA_SOURCE_DIR: ${{ github.workspace }}/cbioportal-backend
        run: python3 test_clickhouse_wsi_schema_parity.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Core Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cbioportal-core/requirements.txt pytest
      - name: Convert the legacy fixtures and validate the converted studies
        working-directory: cbioportal-validation
        # validateData.py must report zero errors on every converted study.
        run: >-
          python3 scripts/wsi_resource_fixtures.py
          --core-dir "$GITHUB_WORKSPACE/cbioportal-core"
          --validate
      - name: Confirm validateData.py rejects the legacy meta_wsi pair
        working-directory: cbioportal-validation
        run: |
          set +e
          PYTHONPATH="$GITHUB_WORKSPACE/cbioportal-core/scripts" python3 \
            "$GITHUB_WORKSPACE/cbioportal-core/scripts/importer/validateData.py" \
            -s src/e2e/js/test/WsiHierarchyController/legacy_wsi_source/wsi_loader_fixture -n \
            >"$RUNNER_TEMP/wsi-legacy-validate.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/wsi-legacy-validate.txt"
          test "$status" -eq 1
          grep -q 'Legacy meta_wsi input is no longer imported' "$RUNNER_TEMP/wsi-legacy-validate.txt"
      - name: Run Core converter and WSI resource validator tests
        working-directory: cbioportal-core/tests
        run: |
          PYTHONPATH=../scripts pytest -q unit_tests_convert_wsi.py
          PYTHONPATH=../scripts pytest -q unit_tests_validate_data.py -k 'wsi or Wsi or ResourceWiseTestCase'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java resource import integration test (Testcontainers)
        working-directory: cbioportal-core
        # -Dtest overrides the surefire includes/excludes of both executions;
        # failIfNoTests=false keeps an execution without a match from failing.
        # Core's pom pins an older backend without resource_data, so the test
        # database is created from the pinned backend's schema instead.
        run: >-
          mvn -B -q -DfailIfNoTests=false -Dtest=TestImportResourceData
          -Dcbioportal.schema.path="$GITHUB_WORKSPACE/cbioportal-backend/src/main/resources/db-scripts/clickhouse/init/schema.sql"
          integration-test

  frontend-children:
    name: Frontend child (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: package
            ref: f480cf210cb89f2eea8c7cb02c7ac902308f6ab1
            # The viewer package's own suite plus the standalone viewer route and
            # app wiring; the package branch carries only the viewer and the
            # Pathology Slides tab (image-ID access).
            unit: >-
              pnpm --filter cbioportal-wsi-viewer run test &&
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/pages/wsi/WsiPatientViewRoute.spec.tsx
              src/shared/components/wsiViewer/wsiAppConfig.spec.tsx
              src/shared/lib/assertWsiOsdBundle.spec.ts
            browser: tests/wsi-foundation-mocked.spec.ts
          - name: study
            ref: 05430c2e7af13c7faec18e1fcfffb5120b2812fe
            unit: >-
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/pages/studyView/tabs/ClinicalDataTab.spec.ts
              src/pages/studyView/resources/FilesAndLinks.spec.tsx
              src/shared/lib/ClinicalAttributeDisplay.spec.ts
              src/shared/lib/ResourcePolicy.spec.ts
            browser: tests/pathology-study-clinical-data.spec.ts
          # codex/wsi-rd-patient: clinical-event loading, the hierarchy-built
          # pathology timeline track, the undated notice and tab link scoping.
          # Known gap: the child has no Playwright spec of its own, so its
          # browser contract is the foundation mock and the rest is Jest.
          - name: patient
            ref: c0651e31b505f88bcaba180d96a56c755f4d4435
            unit: >-
              pnpm --filter cbioportal-wsi-viewer run test &&
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/pages/patientView/timeline/pathologySlidesTimeline.spec.tsx
              src/pages/patientView/timeline/pathologySlidesTimelineLoader.spec.ts
              src/pages/patientView/PatientWsiSlidesTab.spec.tsx
              src/pages/patientView/timeline/UndatedPathologySlidesNotice.spec.tsx
              src/pages/wsi/WsiPatientViewRoute.spec.tsx
            browser: tests/wsi-foundation-mocked.spec.ts
          - name: molecular
            ref: 210693aadbce274d55a1f7771ff533c4e3f820ab
            unit: >-
              pnpm --filter cbioportal-wsi-viewer run test &&
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/shared/api/wsiOncoKbClientInstance.spec.ts
              src/shared/components/wsiViewer/wsiAppConfig.spec.tsx
            browser: tests/wsi-molecular-mocked.spec.ts
          # Checks out the agent pin, which must contain the annotations pin.
          - name: annotations-agent
            ref: 685b16cc20e06f4dd8a6d218225c49af65152b69
            ancestor: 1dafe191ad19f81e4a6b45c31e8367d1ee4b20e7
            unit: >-
              pnpm --filter cbioportal-wsi-viewer run test &&
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/shared/components/MSKTabs/MSKTabs.spec.tsx
              src/shared/components/wsiViewer/wsiAppConfig.spec.tsx
              src/shared/lib/assertWsiOsdBundle.spec.ts
            browser: tests/wsi-annotation-agent.spec.ts tests/wsi-foundation-route.spec.ts
          # codex/wsi-rd-study-slides: the study-view Pathology Slides tab. Its
          # backend endpoint is the backend child raylim/cbioportal#11, outside
          # the pinned backend; the browser contract mocks the study and WSI APIs.
          - name: study-slides
            ref: 1cfc8ad844f9c2246153665b5b96b4887ef8a6fa
            unit: >-
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/pages/studyView/tabs/pathologySlides
              src/shared/components/wsiViewer/wsiAppConfig.spec.tsx
              src/shared/lib/assertWsiOsdBundle.spec.ts
            browser: tests/wsi-study-slides-mocked.spec.ts
          - name: integration
            ref: d9376d2134938c12294f466073fa48c14b81951c
            unit: >-
              pnpm --filter cbioportal-wsi-viewer run test &&
              pnpm exec jest --env=jsdom --runInBand --no-cache
              src/pages/wsi/WsiPatientViewRoute.spec.tsx
              src/shared/components/wsiViewer/wsiAppConfig.spec.tsx
              src/shared/lib/assertWsiOsdBundle.spec.ts
              src/pages/studyView/tabs/ClinicalDataTab.spec.ts
              src/pages/studyView/resources/FilesAndLinks.spec.tsx
              src/shared/lib/ClinicalAttributeDisplay.spec.ts
              src/shared/lib/ResourcePolicy.spec.ts
              src/pages/patientView/timeline/pathologySlidesTimeline.spec.tsx
              src/pages/patientView/timeline/pathologySlidesTimelineLoader.spec.ts
              src/pages/patientView/PatientWsiSlidesTab.spec.tsx
              src/pages/patientView/timeline/UndatedPathologySlidesNotice.spec.tsx
              src/shared/api/wsiOncoKbClientInstance.spec.ts
              src/shared/components/MSKTabs/MSKTabs.spec.tsx
              src/pages/studyView/tabs/pathologySlides
            browser: >-
              tests/wsi-foundation-mocked.spec.ts
              tests/pathology-study-clinical-data.spec.ts
              tests/wsi-molecular-mocked.spec.ts
              tests/wsi-annotation-agent.spec.ts
              tests/wsi-foundation-route.spec.ts
              tests/wsi-study-slides-mocked.spec.ts
    steps:
      - name: Refuse unresolved successor pins
        env:
          CHILD_NAME: ${{ matrix.name }}
          CHILD_REF: ${{ matrix.ref }}
          CHILD_ANCESTOR: ${{ matrix.ancestor }}
          CHILD_UNIT: ${{ matrix.unit }}
          CHILD_BROWSER: ${{ matrix.browser }}
        run: |
          for value in "$CHILD_REF" "$CHILD_ANCESTOR" "$CHILD_UNIT" "$CHILD_BROWSER"; do
            case "$value" in
              *TODO-successor*)
                echo "frontend child $CHILD_NAME still has a TODO-successor placeholder" >&2
                exit 1
                ;;
            esac
          done
          [[ "$CHILD_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify ancestry, typecheck and build
        env:
          CHILD_REF: ${{ matrix.ref }}
          CHILD_ANCESTOR: ${{ matrix.ancestor }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHILD_REF"
          git merge-base --is-ancestor "$FRONTEND_PACKAGE_REF" HEAD
          if [ -n "$CHILD_ANCESTOR" ]; then
            git merge-base --is-ancestor "$CHILD_ANCESTOR" HEAD
          fi
          pnpm run typecheck
          pnpm run build
      - name: Run child unit tests
        run: ${{ matrix.unit }}
      - name: Check child browser contract is discoverable
        working-directory: end-to-end-test-playwright
        env:
          PW_SUITE: wsi
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec playwright test --config=playwright.wsi.config.ts ${{ matrix.browser }} --list
      - name: Install Chromium for the child browser contract
        working-directory: end-to-end-test-playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Serve the child bundle
        run: |
          nohup node_modules/.bin/pushstate-server dist 3000 index.html >/tmp/wsi-child-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wsi-child-server.log
          exit 1
      - name: Execute the child browser contract
        working-directory: end-to-end-test-playwright
        env:
          CBIOPORTAL_URL: http://127.0.0.1:3000
          LOCALDEV: '0'
          PW_SUITE: wsi
          WSI_MOCK_SKIP_LOGIN: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          pnpm exec playwright test --config=playwright.wsi.config.ts ${{ matrix.browser }} --reporter=line,json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
          if (report.stats.expected === 0 || report.stats.skipped !== 0 || report.stats.unexpected !== 0) {
            throw new Error(`child browser contract did not pass: ${JSON.stringify(report.stats)}`);
          }
          console.log(`child browser contract passed: ${report.stats.expected} tests`);
          NODE

  combined-frontend:
    name: Combined frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: frontend-children
    env:
      # Union of the child browser contracts (the patient child has no
      # Playwright spec of its own; see the frontend-children matrix).
      COMBINED_BROWSER_TESTS: >-
        tests/wsi-foundation-mocked.spec.ts
        tests/pathology-study-clinical-data.spec.ts
        tests/wsi-molecular-mocked.spec.ts
        tests/wsi-annotation-agent.spec.ts
        tests/wsi-foundation-route.spec.ts
    steps:
      - name: Refuse unresolved successor pins
        run: |
          for value in "$FRONTEND_PATIENT_REF" "$FRONTEND_MOLECULAR_REF" "$FRONTEND_ANNOTATIONS_REF" \
            "$FRONTEND_AGENT_REF" "$FRONTEND_INTEGRATION_REF" "$COMBINED_BROWSER_TESTS"; do
            case "$value" in
              *TODO-successor*)
                echo 'combined frontend still depends on a TODO-successor placeholder' >&2
                exit 1
                ;;
            esac
          done
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_INTEGRATION_REF }}
          fetch-depth: 0
      - name: Verify integration contains the exact child revisions
        run: |
          test "$(git rev-parse HEAD)" = "$FRONTEND_INTEGRATION_REF"
          git fetch --no-tags origin "$FRONTEND_PACKAGE_REF" "$FRONTEND_STUDY_REF" \
            "$FRONTEND_PATIENT_REF" "$FRONTEND_MOLECULAR_REF" "$FRONTEND_ANNOTATIONS_REF" \
            "$FRONTEND_AGENT_REF"
          for ref in "$FRONTEND_PACKAGE_REF" "$FRONTEND_STUDY_REF" "$FRONTEND_PATIENT_REF" \
            "$FRONTEND_MOLECULAR_REF" "$FRONTEND_ANNOTATIONS_REF" "$FRONTEND_AGENT_REF"; do
            git merge-base --is-ancestor "$ref" HEAD
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm --filter cbioportal-wsi-viewer run test

      - name: Install Playwright suite dependencies
        working-directory: end-to-end-test-playwright
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Chromium for the combined browser contract
        working-directory: end-to-end-test-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve the combined frontend bundle
        run: |
          nohup node_modules/.bin/pushstate-server dist 3000 index.html >/tmp/wsi-frontend-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wsi-frontend-server.log
          exit 1

      - name: Run combined mocked WSI browser contract
        working-directory: end-to-end-test-playwright
        env:
          CBIOPORTAL_URL: http://127.0.0.1:3000
          LOCALDEV: '0'
          PW_SUITE: wsi
          WSI_MOCK_SKIP_LOGIN: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          pnpm exec playwright test --config=playwright.wsi.config.ts \
            $COMBINED_BROWSER_TESTS \
            --reporter=line,json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
          if (report.stats.expected === 0 || report.stats.skipped !== 0 || report.stats.unexpected !== 0) {
            throw new Error(`combined WSI browser contract did not pass: ${JSON.stringify(report.stats)}`);
          }
          console.log(`combined WSI browser contract passed: ${report.stats.expected} tests`);
          NODE

  full-stack-wsi-validation:
    name: Full-stack WSI validation (${{ matrix.variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: package
            ref: f480cf210cb89f2eea8c7cb02c7ac902308f6ab1
          - variant: study
            ref: 05430c2e7af13c7faec18e1fcfffb5120b2812fe
          - variant: patient
            ref: c0651e31b505f88bcaba180d96a56c755f4d4435
          - variant: molecular
            ref: 210693aadbce274d55a1f7771ff533c4e3f820ab
          - variant: annotations-agent
            ref: 685b16cc20e06f4dd8a6d218225c49af65152b69
            ancestor: 1dafe191ad19f81e4a6b45c31e8367d1ee4b20e7
          - variant: study-slides
            ref: 1cfc8ad844f9c2246153665b5b96b4887ef8a6fa
          - variant: integration
            ref: d9376d2134938c12294f466073fa48c14b81951c
    needs:
      - fixture-contract
      - core-import-validation
      - combined-frontend
    steps:
      - name: Refuse unresolved successor pins
        env:
          VARIANT: ${{ matrix.variant }}
          VARIANT_REF: ${{ matrix.ref }}
          VARIANT_ANCESTOR: ${{ matrix.ancestor }}
        run: |
          case "$VARIANT_REF $VARIANT_ANCESTOR" in
            *TODO-successor*)
              echo "full-stack variant $VARIANT still has a TODO-successor placeholder" >&2
              exit 1
              ;;
          esac
          [[ "$VARIANT_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: cbioportal-validation
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: cbioportal-backend
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TEST_STACK_REPOSITORY }}
          ref: ${{ env.TEST_STACK_REF }}
          path: cbioportal-test
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ matrix.ref }}
          path: cbioportal-frontend
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: cbioportal-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TILE_REPOSITORY }}
          ref: ${{ env.TILE_REF }}
          path: cbioportal-tile-server
      - name: Verify the checked-out frontend revision
        working-directory: cbioportal-frontend
        env:
          VARIANT_REF: ${{ matrix.ref }}
          VARIANT_ANCESTOR: ${{ matrix.ancestor }}
        run: |
          test "$(git rev-parse HEAD)" = "$VARIANT_REF"
          git merge-base --is-ancestor "$FRONTEND_PACKAGE_REF" HEAD
          if [ -n "$VARIANT_ANCESTOR" ]; then
            git merge-base --is-ancestor "$VARIANT_ANCESTOR" HEAD
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-check the committed fixtures against the pinned Core converter
        working-directory: cbioportal-validation
        run: >-
          python3 scripts/wsi_resource_fixtures.py
          --core-dir "$GITHUB_WORKSPACE/cbioportal-core" --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Enable pinned JavaScript package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          corepack prepare yarn@1.22.22 --activate
      - name: Run import, authorization, lifecycle, tile, and browser contracts
        working-directory: cbioportal-validation
        env:
          TEST_STACK_DIR: ${{ github.workspace }}/cbioportal-test
          BACKEND_DIR: ${{ github.workspace }}/cbioportal-backend
          BACKEND_REF: ${{ env.BACKEND_REF }}
          FRONTEND_DIR: ${{ github.workspace }}/cbioportal-frontend
          FRONTEND_REF: ${{ matrix.ref }}
          TILE_DIR: ${{ github.workspace }}/cbioportal-tile-server
          CORE_REPOSITORY: ${{ env.CORE_REPOSITORY }}
          CORE_REF: ${{ env.CORE_REF }}
          COMPOSE_REPOSITORY: ${{ env.COMPOSE_REPOSITORY }}
          COMPOSE_REF: ${{ env.COMPOSE_REF }}
          WSI_PORTAL_IMAGE: cbioportal-wsi-validation:${{ github.sha }}-${{ matrix.variant }}
          COMPOSE_PROJECT_NAME: wsi-validation-${{ github.run_id }}-${{ matrix.variant }}
          WSI_VARIANT: ${{ matrix.variant }}
        run: ./scripts/run_wsi_full_stack_validation.sh
      - name: Upload full-stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsi-full-stack-diagnostics-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/wsi-*.log
            ${{ runner.temp }}/wsi-*.txt
          if-no-files-found: ignore

  acceptance:
    name: WSI acceptance gate
    if: always()
    needs:
      - fixture-contract
      - core-import-validation
      - frontend-children
      - combined-frontend
      - full-stack-wsi-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every mandatory WSI gate
        env:
          FIXTURE_RESULT: ${{ needs.fixture-contract.result }}
          CORE_RESULT: ${{ needs.core-import-validation.result }}
          CHILD_RESULT: ${{ needs.frontend-children.result }}
          COMBINED_RESULT: ${{ needs.combined-frontend.result }}
          FULL_STACK_RESULT: ${{ needs.full-stack-wsi-validation.result }}
        run: |
          for result in "$FIXTURE_RESULT" "$CORE_RESULT" "$CHILD_RESULT" "$COMBINED_RESULT" "$FULL_STACK_RESULT"; do
            test "$result" = success || {
              echo "mandatory WSI gate result was $result" >&2
              exit 1
            }
          done

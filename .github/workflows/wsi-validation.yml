name: WSI validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_ENV: master
  BACKEND_REPOSITORY: raylim/cbioportal
  BACKEND_FOUNDATION_REF: 93e9b8c9b4a127b0ae7de4fcecf98192faac068f
  FRONTEND_REPOSITORY: raylim/cbioportal-frontend
  FRONTEND_FOUNDATION_REF: c4f0fae883e1d26da6b12f84fd35f8f1b319b2a9
  FRONTEND_MOLECULAR_REF: 198546399d62ca815782ed70cfea1c8dd8a94781
  FRONTEND_PATIENT_REF: 435a40bfb96de988d63ab7726dd61efbb22a28c5
  FRONTEND_STUDY_REF: 3f9428e7d8650dd34d510ff7f976add8e08285d1
  FRONTEND_INTEGRATION_REF: a9a8e978ebec620c400fa569db53344fd0f76837
  CORE_REPOSITORY: raylim/cbioportal-core
  CORE_REF: c178bb7daf8999194e82b09d387eca3ab39a4b65
  TEST_STACK_REPOSITORY: cBioPortal/cbioportal-test
  TEST_STACK_REF: a450018f8fdadf5fe568d66d41154e9f25281dfb

jobs:
  fixture-contract:
    name: Verify WSI fixture and source pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture metadata and immutable pins
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('wsi-validation-manifest.json').read_text())
          allowed = Path('src/e2e/js/test/WsiHierarchyController/wsi_loader_fixture/meta_study.txt').read_text()
          denied = Path('src/e2e/js/test/WsiHierarchyController/wsi_loader_control_fixture/meta_study.txt').read_text()
          assert 'groups: PUBLIC_STUDIES' in allowed
          assert 'groups: WSI_DENIED' in denied
          assert 'WSI_AUTHENTICATED_E2E: "true"' in Path('.circleci/config.yml').read_text()
          assert '${{ env.BACKEND_FOUNDATION_REF }}' == manifest['backend']['foundation']
          assert len('${{ env.CORE_REF }}') == 40
          assert '${{ env.CORE_REF }}' == manifest['core']['ref']
          assert '${{ env.TEST_STACK_REF }}' == manifest['testStack']['ref']
          assert '${{ env.TEST_STACK_REPOSITORY }}' == manifest['testStack']['repository']
          assert '${{ env.FRONTEND_FOUNDATION_REF }}' == manifest['frontend']['foundation']
          assert '${{ env.FRONTEND_MOLECULAR_REF }}' == manifest['frontend']['molecular']
          assert '${{ env.FRONTEND_PATIENT_REF }}' == manifest['frontend']['patient']
          assert '${{ env.FRONTEND_STUDY_REF }}' == manifest['frontend']['study']
          assert '${{ env.FRONTEND_INTEGRATION_REF }}' == manifest['frontend']['integration']
          assert manifest['tile']['repository'] == 'cBioPortal/cbioportal-tile-server'
          assert len(manifest['tile']['ref']) == 40
          print('fixture metadata and source pins are present; live authorization is covered by the CircleCI API job')
          PY

  core-import-validation:
    name: Core WSI validation and import tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: cbioportal-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run WSI validator tests
        working-directory: cbioportal-core/tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt pytest
          PYTHONPATH=../scripts pytest -q unit_tests_validate_data.py -k wsi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java WSI import tests
        working-directory: cbioportal-core
        run: mvn -q -Dtest=ImportWsiDataTest test

  frontend-children:
    name: Frontend child (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation
            ref: c4f0fae883e1d26da6b12f84fd35f8f1b319b2a9
            jest: src/shared/components/wsiViewer/WSIViewer.foundation.spec.tsx src/shared/components/wsiViewer/wsiNavPanel.spec.tsx
            browser: tests/wsi-foundation-mocked.spec.ts
          - name: molecular
            ref: 198546399d62ca815782ed70cfea1c8dd8a94781
            jest: src/shared/api/wsiOncoKbClientInstance.spec.ts src/shared/components/wsiViewer/wsiAnnotationDataUtils.spec.ts src/shared/components/wsiViewer/WSIViewer.spec.tsx
            browser: tests/wsi-foundation-mocked.spec.ts
          - name: patient
            ref: 435a40bfb96de988d63ab7726dd61efbb22a28c5
            jest: src/shared/components/wsiViewer/wsiNavPanel.spec.tsx src/pages/patientView/PatientViewPageTabs.spec.tsx src/pages/patientView/PatientViewUrlWrapper.spec.ts
            browser: tests/wsi-pathology-mocked.spec.ts --grep-invert "reference[- ]sample"
          - name: study
            ref: 3f9428e7d8650dd34d510ff7f976add8e08285d1
            jest: src/pages/studyView/tabs/ClinicalDataTab.spec.ts
            browser: tests/wsi-foundation-mocked.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          pnpm run typecheck
          pnpm run build
      - name: Run child unit tests
        run: |
          if [ "${{ matrix.name }}" = "patient" ] || [ "${{ matrix.name }}" = "study" ]; then
            pnpm exec jest ${{ matrix.jest }} --runInBand --env=jsdom --no-cache
          else
            pnpm exec jest ${{ matrix.jest }} --runInBand --no-cache
          fi
      - name: Check child browser contract is discoverable
        working-directory: end-to-end-test-playwright
        env:
          PW_SUITE: wsi
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec playwright test --config=playwright.wsi.config.ts ${{ matrix.browser }} --list
      - name: Install Chromium for the child browser contract
        working-directory: end-to-end-test-playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Serve the child bundle
        run: |
          nohup node_modules/.bin/pushstate-server dist 3000 >/tmp/wsi-child-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wsi-child-server.log
          exit 1
      - name: Execute the child browser contract
        working-directory: end-to-end-test-playwright
        env:
          CBIOPORTAL_URL: http://127.0.0.1:3000
          LOCALDEV: '0'
          PW_SUITE: wsi
          WSI_MOCK_SKIP_LOGIN: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          pnpm exec playwright test --config=playwright.wsi.config.ts ${{ matrix.browser }} --reporter=line,json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
          if (report.stats.expected === 0 || report.stats.skipped !== 0 || report.stats.unexpected !== 0) {
            throw new Error(`child browser contract did not pass: ${JSON.stringify(report.stats)}`);
          }
          console.log(`child browser contract passed: ${report.stats.expected} tests`);
          NODE

  combined-frontend:
    name: Combined frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-children
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_INTEGRATION_REF }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Install Playwright suite dependencies
        working-directory: end-to-end-test-playwright
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Chromium for the combined browser contract
        working-directory: end-to-end-test-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve the combined frontend bundle
        run: |
          nohup node_modules/.bin/pushstate-server dist 3000 >/tmp/wsi-frontend-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wsi-frontend-server.log
          exit 1

      - name: Run combined mocked WSI browser contract
        working-directory: end-to-end-test-playwright
        env:
          CBIOPORTAL_URL: http://127.0.0.1:3000
          LOCALDEV: '0'
          PW_SUITE: wsi
          WSI_MOCK_SKIP_LOGIN: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          pnpm exec playwright test --config=playwright.wsi.config.ts tests/wsi-pathology-mocked.spec.ts --reporter=line,json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
          if (report.stats.expected === 0 || report.stats.skipped !== 0 || report.stats.unexpected !== 0) {
            throw new Error(`combined WSI browser contract did not pass: ${JSON.stringify(report.stats)}`);
          }
          console.log(`combined WSI browser contract passed: ${report.stats.expected} tests`);
          NODE

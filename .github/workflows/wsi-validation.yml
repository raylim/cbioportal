name: WSI validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  BRANCH_ENV: master
  FRONTEND_REPOSITORY: raylim/cbioportal-frontend
  FRONTEND_FOUNDATION_REF: dbe50eabf0c8f2d0aa42cc2368b3adb3f0235b71
  FRONTEND_MOLECULAR_REF: 4c35e01f3d9cac15d89cfe483e5bf39aa20f2807
  FRONTEND_PATIENT_REF: 664c1b9b609e22b7a3e2d689d9b912c29e5a089c
  FRONTEND_STUDY_REF: 4292c7c24f045b61aee0328902174e252846a2ec
  FRONTEND_INTEGRATION_REF: e904a4b2aba0108516edea314a715a751818e7c1
  CORE_REPOSITORY: raylim/cbioportal-core
  CORE_REF: c178bb7daf8999194e82b09d387eca3ab39a4b65

jobs:
  fixture-contract:
    name: Verify WSI fixture and authorization contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture permissions and immutable pins
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path

          allowed = Path('src/e2e/js/test/WsiHierarchyController/wsi_loader_fixture/meta_study.txt').read_text()
          denied = Path('src/e2e/js/test/WsiHierarchyController/wsi_loader_control_fixture/meta_study.txt').read_text()
          assert 'groups: PUBLIC_STUDIES' in allowed
          assert 'groups: WSI_DENIED' in denied
          assert 'WSI_AUTHENTICATED_E2E: "true"' in Path('.circleci/config.yml').read_text()
          assert len('${{ env.CORE_REF }}') == 40
          print('fixture permissions and source pins are present')
          PY

  core-import-validation:
    name: Core WSI validation and import tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: cbioportal-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run WSI validator tests
        working-directory: cbioportal-core/tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt pytest
          PYTHONPATH=../scripts pytest -q unit_tests_validate_data.py -k wsi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Java WSI import tests
        working-directory: cbioportal-core
        run: mvn -q -Dtest=ImportWsiDataTest test

  frontend-children:
    name: Frontend child (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foundation
            ref: dbe50eabf0c8f2d0aa42cc2368b3adb3f0235b71
            jest: src/shared/components/wsiViewer/WSIViewer.foundation.spec.tsx src/shared/components/wsiViewer/wsiNavPanel.spec.tsx
            browser: tests/wsi-foundation-route.spec.ts
          - name: molecular
            ref: 4c35e01f3d9cac15d89cfe483e5bf39aa20f2807
            jest: src/shared/api/wsiOncoKbClientInstance.spec.ts src/shared/components/wsiViewer/wsiAnnotationDataUtils.spec.ts src/shared/components/wsiViewer/WSIViewer.spec.tsx
            browser: tests/wsi-foundation-route.spec.ts
          - name: patient
            ref: 664c1b9b609e22b7a3e2d689d9b912c29e5a089c
            jest: src/shared/components/wsiViewer/wsiNavPanel.spec.tsx src/pages/patientView/PatientViewPageTabs.spec.tsx src/pages/patientView/PatientViewUrlWrapper.spec.ts
            browser: tests/wsi-foundation-route.spec.ts tests/pathology-summary.spec.ts tests/pathology-timing-contract.spec.ts
          - name: study
            ref: 4292c7c24f045b61aee0328902174e252846a2ec
            jest: src/pages/studyView/tabs/ClinicalDataTab.spec.ts
            browser: tests/wsi-foundation-route.spec.ts tests/pathology-study-clinical-data.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          pnpm run typecheck
          pnpm run build
      - name: Run child unit tests
        run: |
          if [ "${{ matrix.name }}" = "patient" ] || [ "${{ matrix.name }}" = "study" ]; then
            pnpm exec jest ${{ matrix.jest }} --runInBand --env=jsdom --no-cache
          else
            pnpm exec jest ${{ matrix.jest }} --runInBand --no-cache
          fi
      - name: Check child browser specs are discoverable
        working-directory: end-to-end-test-playwright
        env:
          PW_SUITE: wsi
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec playwright test ${{ matrix.browser }} --list

  combined-frontend:
    name: Combined frontend validation
    runs-on: ubuntu-latest
    needs: frontend-children
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPOSITORY }}
          ref: ${{ env.FRONTEND_INTEGRATION_REF }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Install Playwright suite dependencies
        working-directory: end-to-end-test-playwright
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Chromium for the combined browser contract
        working-directory: end-to-end-test-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve the combined frontend bundle
        run: |
          nohup node_modules/.bin/pushstate-server dist 3000 >/tmp/wsi-frontend-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wsi-frontend-server.log
          exit 1

      - name: Run combined mocked WSI browser contract
        working-directory: end-to-end-test-playwright
        env:
          CBIOPORTAL_URL: http://127.0.0.1:3000
          LOCALDEV: '0'
          WSI_MOCK_SKIP_LOGIN: '1'
        run: |
          pnpm exec playwright test tests/wsi-pathology-mocked.spec.ts --reporter=line,json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('test-results/report.json', 'utf8'));
          if (report.stats.expected === 0 || report.stats.skipped !== 0 || report.stats.unexpected !== 0) {
            throw new Error(`combined WSI browser contract did not pass: ${JSON.stringify(report.stats)}`);
          }
          console.log(`combined WSI browser contract passed: ${report.stats.expected} tests`);
          NODE
